sources:
  - id: apple-dev-forum
    name: "Apple Developer Forums"
    base_url: "https://developer.apple.com/forums/"
    requires_login: true
    note: "公开列表可爬，部分帖子内容需登录。P2 默认只抓公开 summary，登录态采集由用户 session 手动补齐。"

  - id: reddit-iosprogramming
    name: "r/iOSProgramming"
    base_url: "https://www.reddit.com/r/iOSProgramming/"
    requires_login: false

  - id: v2ex-ios
    name: "V2EX iOS 节点"
    base_url: "https://www.v2ex.com/go/ios"
    requires_login: false

  - id: zhihu-ios-rejection
    name: "知乎 iOS 拒审关键词"
    base_url: "https://www.zhihu.com/search?q=App+Store+%E6%8B%92%E5%AE%A1"
    requires_login: false

  - id: hackernews-ios
    name: "Hacker News iOS rejection"
    base_url: "https://hn.algolia.com/?q=app+store+rejection"
    requires_login: false

anonymization:
  enabled: true
  rules:
    - type: hash_bundle_id
      desc: "Bundle ID 用 sha256 前 8 位脱敏，保留 prefix domain"
    - type: redact_company_name
      desc: "帖子中出现的他人公司名替换为 [company-N]"
    - type: redact_email
      desc: "邮箱 local part 替换为 ***"
