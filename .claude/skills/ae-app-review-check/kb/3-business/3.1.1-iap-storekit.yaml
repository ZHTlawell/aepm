guideline: "3.1.1"
chapter: "3-Business"
title: "In-App Purchase — 数字内容必须走 StoreKit"
severity: high
official_text: |
  If you want to unlock features or functionality within your app, (by way of
  example: subscriptions, in-game currencies, game levels, access to premium
  content, or unlocking a full version), you must use in-app purchase.
  Apps may not use their own mechanisms to unlock content or functionality,
  such as license keys, augmented reality markers, QR codes, cryptocurrencies
  and cryptocurrency wallets, etc.

  Any credits or in-game currencies purchased via in-app purchase may not
  expire, and you should make sure you have a restore mechanism for any
  restorable in-app purchases.

  Apps and their metadata may not include buttons, external links, or other
  calls to action that direct customers to purchasing mechanisms other than
  in-app purchase. (StoreKit External Purchase Link Entitlement 和 US
  storefront 为例外，见 3.1.1(a))
official_url: "https://developer.apple.com/app-store/review/guidelines/#3.1.1"

triggers:
  - "App 有 Paywall 页面或订阅流程"
  - "售卖数字内容、游戏关卡、premium 功能解锁"
  - "使用了 Superwall / RevenueCat / Adapty 等 paywall 工具"

auto_checks:
  - id: "3.1.1-paywall-needs-storekit"
    type: shell
    command: "if grep -rqEn 'PaywallView|SuperwallService|Superwall\\.shared|RevenueCat|Purchases\\.shared|Adapty|subscription' --include='*.swift' . 2>/dev/null; then grep -rEn 'import StoreKit|import StoreKitTest|Product\\.|Transaction\\.|AppStore\\.' --include='*.swift' . 2>/dev/null | head -3 || echo 'NO_STOREKIT_USAGE'; else echo 'NO_PAYWALL_DETECTED'; fi"
    expected: no_match
    match_pattern: "NO_STOREKIT_USAGE"
    severity: high
    on_fail: "检测到 Paywall 代码但未使用 StoreKit — 数字内容解锁必须走 StoreKit（3.1.1）"
    case_refs: []

  - id: "3.1.1-no-third-party-payment-sdk"
    type: shell
    command: "grep -rEn 'import Stripe|import AlipaySDK|import WXPay|import WechatOpenSDK|import PayPal|import Braintree' --include='*.swift' --include='*.m' . 2>/dev/null | head -5"
    expected: empty
    severity: high
    on_fail: "集成了第三方支付 SDK（Stripe/Alipay/WeChatPay/PayPal/Braintree）— 数字内容不允许走 IAP 以外通道。若用于物理商品/服务（3.1.3(e)），必须在 Review Notes 中说明并提供证据"
    case_refs: ["case-2026-006"]

  - id: "3.1.1-restore-purchase-exists"
    type: shell
    command: "if grep -rqEn 'PaywallView|SuperwallService|Superwall\\.shared|RevenueCat|Purchases\\.shared|Adapty' --include='*.swift' . 2>/dev/null; then grep -rEn 'restorePurchases|AppStore\\.sync|Transaction\\.currentEntitlements|Purchases\\.shared\\.restorePurchases|Superwall\\.shared\\.restorePurchases' --include='*.swift' . 2>/dev/null | head -3 || echo 'NO_RESTORE'; else echo 'NO_PAYWALL_DETECTED'; fi"
    expected: no_match
    match_pattern: "NO_RESTORE"
    severity: high
    on_fail: "有付费内容但未实现 Restore Purchase — Guideline 3.1.1 强制要求 restore 机制"
    case_refs: []

  - id: "3.1.1-no-external-purchase-url"
    type: shell
    command: "grep -rEn '(upgrade|subscribe|buy|premium|pro)[^A-Za-z0-9]{0,5}https?://[^\"]*\\.(com|io|app|net)' --include='*.swift' . 2>/dev/null | grep -vE 'apple\\.com|privacypolicy|terms-of-service|terms\\.html' | head -5"
    expected: empty
    severity: medium
    on_fail: "源码中疑似存在指向外部网站的购买链接。非 US storefront 且未申请 External Purchase Entitlement 时违反 3.1.1"
    case_refs: []

review_notes_template: |
  - All digital content purchases use StoreKit 2 (via Superwall/RevenueCat subscription IDs: <list IDs>).
  - Restore Purchase is available in Settings → Restore Purchases.
  - No third-party payment SDKs are used for digital content.
  - [If physical goods exist] <specify which feature uses non-IAP payment and why, cite Guideline 3.1.3(e)>

fix_suggestions:
  - "Paywall 改走 StoreKit 2（BCStoreKit Route B；Route A Superwall 方案已废弃）"
  - "Settings 页面补 Restore Purchase 按钮"
  - "如集成了 Alipay/WeChatPay 用于物理商品，在 Review Notes 说明 + 附合同证据（参考 case-2026-006）"

case_refs: ["case-2026-006"]
updated_at: "2026-04-22"
