guideline: "3.1.2"
chapter: "3-Business"
title: "Subscriptions — 订阅披露 + 条款 + 续费透明"
severity: high
official_text: |
  3.1.2 Subscriptions: Apps may offer auto-renewable in-app purchase
  subscriptions, regardless of category on the App Store.

  3.1.2(a) Permissible uses: If you offer an auto-renewable subscription, you
  must provide ongoing value to the customer, and the subscription period must
  last at least seven days and be available across all of the user's devices.

  3.1.2(c) Subscription Information: Before asking a customer to subscribe,
  you should clearly describe what the user will get for the price. How many
  issues per month? How much cloud storage? What kind of access to your
  service? Ensure you clearly communicate the requirements described in
  Schedule 2 of the Apple Developer Program License Agreement.

  (Apple requires auto-renewable subscription Paywall to display, at minimum:
  subscription title, price, period, auto-renewal disclosure, and links to
  Terms of Service + Privacy Policy. See Schedule 2.)
official_url: "https://developer.apple.com/app-store/review/guidelines/#3.1.2"

triggers:
  - "App 提供 auto-renewable subscription"
  - "Paywall 页面有订阅选项"

auto_checks:
  - id: "3.1.2-paywall-has-terms-link"
    type: shell
    command: "if grep -rqEn 'PaywallView|SuperwallService|RevenueCat|Adapty|subscribe' --include='*.swift' . 2>/dev/null; then grep -rEn 'Terms|Terms of Service|terms-of-service|TOS|服务条款|使用条款' --include='*.swift' --include='*.strings' --include='*.html' . 2>/dev/null | head -3 || echo 'MISSING_TERMS'; else echo 'NO_SUBSCRIPTION'; fi"
    expected: no_match
    match_pattern: "MISSING_TERMS"
    severity: high
    on_fail: "有订阅但 Paywall 无 Terms of Service 链接展示 — 3.1.2(c) 强制要求"
    case_refs: []

  - id: "3.1.2-paywall-has-privacy-link"
    type: shell
    command: "if grep -rqEn 'PaywallView|SuperwallService|RevenueCat|Adapty|subscribe' --include='*.swift' . 2>/dev/null; then grep -rEn 'Privacy Policy|privacyPolicy|privacy-policy|隐私政策' --include='*.swift' --include='*.strings' . 2>/dev/null | head -3 || echo 'MISSING_PRIVACY'; else echo 'NO_SUBSCRIPTION'; fi"
    expected: no_match
    match_pattern: "MISSING_PRIVACY"
    severity: high
    on_fail: "有订阅但 Paywall 无 Privacy Policy 链接展示 — 3.1.2(c)"
    case_refs: []

  - id: "3.1.2-auto-renew-disclosure"
    type: shell
    command: "if grep -rqEn 'PaywallView|SuperwallService|RevenueCat|Adapty|subscribe' --include='*.swift' . 2>/dev/null; then grep -rEn 'auto-renew|auto renewable|自动续费|自动续订|cancel anytime|随时取消' --include='*.swift' --include='*.strings' --include='*.html' . 2>/dev/null | head -3 || echo 'MISSING_AUTO_RENEW'; else echo 'NO_SUBSCRIPTION'; fi"
    expected: no_match
    match_pattern: "MISSING_AUTO_RENEW"
    severity: high
    on_fail: "有订阅但 Paywall 未披露 '自动续费' 或 '取消方式' — 3.1.2(c) 要求清晰说明"
    case_refs: []

review_notes_template: |
  - Paywall displays subscription price, period, auto-renewal notice, and links to
    Terms of Service + Privacy Policy (per Schedule 2 of Developer Program License Agreement).

fix_suggestions:
  - "Paywall 底部加 'Terms of Service' + 'Privacy Policy' 链接（跳外部 URL 或 App 内 WebView）"
  - "Paywall 文案显式说明 '自动续费，可随时在 Settings → Apple ID → Subscriptions 取消'"

known_limitations:
  - "Paywall UI 由 Superwall/RevenueCat 等工具在远程后台配置时，本地源码扫不到 Terms/Privacy/auto-renew 文案。PM 必须人工登录对应 dashboard 复核 Paywall 模板是否合规"

case_refs: []
updated_at: "2026-04-22"
