guideline: "5.1.1"
chapter: "5-Legal"
title: "Data Collection and Storage — 隐私政策 + 登录门槛 + 账户删除"
severity: high
official_text: |
  (i) Privacy Policies: All apps must include a link to their privacy policy
  in the App Store Connect metadata field and within the app in an easily
  accessible manner. The privacy policy must clearly and explicitly:
    - Identify what data the app collects, how it collects that data, and all uses of that data.
    - Confirm that any third party with whom an app shares user data will provide
      the same or equal protection of user data.
    - Explain data retention/deletion policies and describe how a user can
      revoke consent and/or request deletion.

  (ii) Permission: Apps that collect user or usage data must secure user consent.
  Paid functionality must not be dependent on or require a user to grant access
  to this data.

  (v) Account Sign-In: If your app doesn't include significant account-based
  features, let people use it without a login. If your app supports account
  creation, you must also offer account deletion within the app.

  Apps cannot require user registration prior to allowing access to app content
  and features that are not associated specifically to the user. (2025-07 拒审
  原文来自 case-2026-004)
official_url: "https://developer.apple.com/app-store/review/guidelines/#5.1.1"

triggers:
  - "任何 App 都要有 privacy policy URL"
  - "App 支持账户注册 → 必须有账户删除"
  - "App 入口需要登录才能用"

auto_checks:
  - id: "5.1.1-privacy-policy-url-exists"
    type: shell
    command: "grep -rEn 'privacyPolicy|privacy.*policy|privacy_policy|隐私政策' --include='*.swift' --include='*.plist' --include='*.strings' . 2>/dev/null | head -3"
    expected: non_empty
    severity: high
    on_fail: "未找到 privacy policy URL 引用 — 上架和外部 TestFlight 都要求 5.1.1(i)"
    case_refs: []

  - id: "5.1.1-account-deletion-if-signup"
    type: shell
    command: "if grep -rqEn 'signUp|SignUp|register|createAccount|CreateAccountView|SignInWithAppleButton' --include='*.swift' . 2>/dev/null; then grep -rEn 'deleteAccount|DeleteAccount|account.*delete|删除账户|delete.*account' --include='*.swift' . 2>/dev/null | head -3 || echo 'MISSING_ACCOUNT_DELETION'; else echo 'NO_SIGNUP_DETECTED'; fi"
    expected: no_match
    match_pattern: "MISSING_ACCOUNT_DELETION"
    severity: high
    on_fail: "App 支持注册但未提供账户删除 — 5.1.1(v) 强制要求（2022 起）"
    case_refs: []

  - id: "5.1.1-no-forced-login-at-entry-swiftui"
    type: shell
    command: "if grep -rqEn '(WindowGroup|SceneDelegate|@main).*\\{' --include='*.swift' . 2>/dev/null; then grep -rEn 'LoginView\\(\\)|SignInView\\(\\)|\\.isAuthenticated\\s*\\?\\s*.*View\\(\\)\\s*:\\s*LoginView' --include='*.swift' . 2>/dev/null | head -5 | grep -vE '//\\s' || true; fi"
    expected: empty
    severity: medium
    on_fail: "SwiftUI App 入口疑似强制登录（WindowGroup 根视图是 LoginView/SignInView）— 若 App 有大量非账户相关功能，违反 5.1.1(v)。参考 case-2026-004"
    case_refs: ["case-2026-004"]

  - id: "5.1.1-no-forced-login-at-entry-uikit"
    type: shell
    command: "grep -rEn 'rootViewController\\s*=\\s*[^/\\n]*(Login|SignIn|Auth)[A-Za-z]*(ViewController|VC|Controller)' --include='*.swift' --include='*.m' --include='*.mm' . 2>/dev/null | grep -vE '//\\s|isLoggedIn\\s*\\?' | head -5"
    expected: empty
    severity: medium
    on_fail: "UIKit App 入口疑似强制登录（rootViewController 直接赋值为 LoginViewController 类）— 参考 case-2026-004；如 App 大部分功能非账户相关，应改为可访客使用"
    case_refs: ["case-2026-004"]

  - id: "5.1.1-att-permission-if-tracking"
    type: shell
    command: "if grep -rqEn 'import Adjust|import AppsFlyerLib|import Branch|import Amplitude' --include='*.swift' . 2>/dev/null; then grep -rEn 'NSUserTrackingUsageDescription|ATTrackingManager\\.requestTrackingAuthorization' --include='*.swift' --include='*.plist' . 2>/dev/null | head -3 || echo 'MISSING_ATT'; else echo 'NO_TRACKING_SDK'; fi"
    expected: no_match
    match_pattern: "MISSING_ATT"
    severity: high
    on_fail: "使用归因/追踪 SDK 但未配置 ATT（NSUserTrackingUsageDescription + requestTrackingAuthorization）— 违反 5.1.2"
    case_refs: []

  - id: "5.1.1-purpose-strings-for-sensitive-apis"
    type: shell
    command: "NEEDED=''; grep -rq 'AVCaptureDevice\\|UIImagePickerController.*camera' --include='*.swift' . 2>/dev/null && ! grep -rq 'NSCameraUsageDescription' --include='*.plist' . 2>/dev/null && NEEDED=\"$NEEDED Camera\"; grep -rq 'CLLocationManager' --include='*.swift' . 2>/dev/null && ! grep -rq 'NSLocationWhenInUseUsageDescription\\|NSLocationAlwaysAndWhenInUseUsageDescription' --include='*.plist' . 2>/dev/null && NEEDED=\"$NEEDED Location\"; grep -rq 'PHPhotoLibrary\\|UIImagePickerController.*photoLibrary' --include='*.swift' . 2>/dev/null && ! grep -rq 'NSPhotoLibraryUsageDescription' --include='*.plist' . 2>/dev/null && NEEDED=\"$NEEDED Photos\"; grep -rq 'AVAudioRecorder\\|AVAudioSession.*record' --include='*.swift' . 2>/dev/null && ! grep -rq 'NSMicrophoneUsageDescription' --include='*.plist' . 2>/dev/null && NEEDED=\"$NEEDED Microphone\"; [ -n \"$NEEDED\" ] && echo \"MISSING_PURPOSE:$NEEDED\" || true"
    expected: empty
    severity: high
    on_fail: "使用敏感 API（Camera/Location/Photos/Microphone）但 Info.plist 缺 usage description — Apple 会回 ITMS-90683"
    case_refs: []

review_notes_template: |
  - Privacy policy URL is provided in ASC metadata and accessible from Settings in the app.
  - [If signup present] Account deletion is available under Settings → Account → Delete Account.
  - [If no login required] The app functions fully without registration; login is only required for account-specific features (e.g. cloud sync).
  - [If tracking SDK] App Tracking Transparency is properly requested.

fix_suggestions:
  - "部署 privacy policy 到公开 URL，填入 ASC App Privacy + 在 Settings 入口给用户可访问链接"
  - "账户删除：Settings → Account → Delete Account，调用后端 API 并清本地凭证"
  - "入口页去掉强制登录（参考 case-2026-004 修复方案）"
  - "敏感 API 的 Info.plist 补 NSCameraUsageDescription / NSLocationWhenInUseUsageDescription 等"

case_refs: ["case-2026-004"]
updated_at: "2026-04-22"
