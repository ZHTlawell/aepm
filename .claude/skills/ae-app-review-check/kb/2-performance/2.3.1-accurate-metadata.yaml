guideline: "2.3.1"
chapter: "2-Performance"
title: "Accurate Metadata — 元数据完整性 + Privacy Manifest"
severity: high
rubric:
  dimension: D2
  score_on_pass: 3
  score_on_warn: 2
  score_on_fail: 0
  weight: 1
official_text: |
  (a) Don't include any hidden, dormant, or undocumented features in your app;
  your app's functionality should be clear to end users and App Review.
  All new features, functionality, and product changes must be described with
  specificity in the Notes for Review section of App Store Connect (generic
  descriptions will be rejected) and accessible for review.

  (b) Egregious or repeated behavior is grounds for removal from the Apple
  Developer Program.

  额外附加（Privacy Manifest 合规，2024-05-01 起强制）:
  Apps that don't describe their use of required reason API in their privacy
  manifest file aren't accepted by App Store Connect.
  (来源: developer.apple.com/documentation/bundleresources/describing-use-of-required-reason-api)
official_url: "https://developer.apple.com/app-store/review/guidelines/#2.3.1"

triggers:
  - "任何 App 提审前都要过"
  - "使用 Required Reason API 的 App（iOS 17+ / macOS 14+ / tvOS 17+ / visionOS 1+ / watchOS 10+）"
  - "使用了 Apple 清单中 87 个第三方 SDK 之一（见 _sources/apple-official/third-party-sdk-requirements.md）"

auto_checks:
  - id: "2.3.1-privacy-manifest-exists"
    type: shell
    command: "find . -name 'PrivacyInfo.xcprivacy' -not -path '*/Pods/*' -not -path '*/.build/*' -not -path '*/DerivedData/*' 2>/dev/null | head -1"
    expected: non_empty
    severity: high
    on_fail: "未找到 PrivacyInfo.xcprivacy — 使用 Required Reason API 或受限 SDK 时必须提供。Apple 会回 ITMS-91053（缺 API 声明）或 ITMS-91061（缺 SDK manifest）"
    case_refs: ["case-2026-001", "case-2026-003"]

  - id: "2.3.1-privacy-manifest-plist-valid"
    type: shell
    command: "MF=$(find . -name 'PrivacyInfo.xcprivacy' -not -path '*/Pods/*' -not -path '*/.build/*' -not -path '*/DerivedData/*' 2>/dev/null | head -1); if [ -n \"$MF\" ]; then plutil -lint \"$MF\" 2>&1 | grep -v '^.*: OK$' || true; fi"
    expected: empty
    severity: high
    on_fail: "PrivacyInfo.xcprivacy plist 格式无效 — Apple 会回 ITMS-91056"
    case_refs: ["case-2026-002"]

  - id: "2.3.1-required-reason-api-userdefaults"
    type: shell
    command: "if grep -rqEn 'UserDefaults|NSUserDefaults' --include='*.swift' --include='*.m' . 2>/dev/null; then MF=$(find . -name 'PrivacyInfo.xcprivacy' -not -path '*/Pods/*' 2>/dev/null | head -1); if [ -n \"$MF\" ]; then grep 'NSPrivacyAccessedAPICategoryUserDefaults' \"$MF\" || echo 'MISSING_USERDEFAULTS_DECLARATION'; else echo 'NO_MANIFEST'; fi; fi"
    expected: match
    match_pattern: "NSPrivacyAccessedAPICategoryUserDefaults"
    severity: high
    on_fail: "代码用了 UserDefaults 但 PrivacyInfo.xcprivacy 未声明 NSPrivacyAccessedAPICategoryUserDefaults — ITMS-91053"
    case_refs: ["case-2026-001"]

  - id: "2.3.1-required-reason-api-disk-space"
    type: shell
    command: "if grep -rqEn 'volumeAvailableCapacityKey|volumeTotalCapacityKey|systemFreeSize|statfs\\(|statvfs\\(' --include='*.swift' --include='*.m' . 2>/dev/null; then MF=$(find . -name 'PrivacyInfo.xcprivacy' -not -path '*/Pods/*' 2>/dev/null | head -1); if [ -n \"$MF\" ]; then grep 'NSPrivacyAccessedAPICategoryDiskSpace' \"$MF\" || echo 'MISSING_DISKSPACE_DECLARATION'; else echo 'NO_MANIFEST'; fi; fi"
    expected: no_match
    match_pattern: "MISSING_DISKSPACE_DECLARATION|NO_MANIFEST"
    severity: high
    on_fail: "代码访问 disk space 但 PrivacyInfo.xcprivacy 未声明 NSPrivacyAccessedAPICategoryDiskSpace — ITMS-91053"
    case_refs: ["case-2026-001"]

  - id: "2.3.1-required-reason-api-file-timestamp"
    type: shell
    command: "if grep -rqEn '\\.creationDate|\\.modificationDate|fileModificationDate|contentModificationDateKey|getattrlist\\(|fstatat\\(|lstat\\(' --include='*.swift' --include='*.m' . 2>/dev/null; then MF=$(find . -name 'PrivacyInfo.xcprivacy' -not -path '*/Pods/*' 2>/dev/null | head -1); if [ -n \"$MF\" ]; then grep 'NSPrivacyAccessedAPICategoryFileTimestamp' \"$MF\" || echo 'MISSING_FILETIMESTAMP_DECLARATION'; else echo 'NO_MANIFEST'; fi; fi"
    expected: no_match
    match_pattern: "MISSING_FILETIMESTAMP_DECLARATION|NO_MANIFEST"
    severity: medium
    on_fail: "代码访问文件时间戳但未声明 NSPrivacyAccessedAPICategoryFileTimestamp"
    case_refs: ["case-2026-001"]

  - id: "2.3.1-required-reason-api-system-boot-time"
    type: shell
    command: "if grep -rqEn 'systemUptime|mach_absolute_time\\(' --include='*.swift' --include='*.m' . 2>/dev/null; then MF=$(find . -name 'PrivacyInfo.xcprivacy' -not -path '*/Pods/*' 2>/dev/null | head -1); if [ -n \"$MF\" ]; then grep 'NSPrivacyAccessedAPICategorySystemBootTime' \"$MF\" || echo 'MISSING_SYSTEMBOOTTIME_DECLARATION'; else echo 'NO_MANIFEST'; fi; fi"
    expected: no_match
    match_pattern: "MISSING_SYSTEMBOOTTIME_DECLARATION|NO_MANIFEST"
    severity: medium
    on_fail: "代码访问 system boot time 但未声明 NSPrivacyAccessedAPICategorySystemBootTime"
    case_refs: ["case-2026-001"]

  - id: "2.3.1-third-party-sdk-privacy-manifest"
    type: shell
    command: "python3 scripts/app-review-check-sdks.py --project-dir . --sdk-list skills/pm/ae-app-review-check/kb/_sources/apple-official/third-party-sdk-requirements.md 2>&1 | grep -E '^(FAIL|MISSING)' | head -10"
    expected: empty
    severity: high
    on_fail: "第三方 SDK 使用了 Apple 清单内的 SDK 但缺少 PrivacyInfo.xcprivacy — ITMS-91061（2024-11-12 起强制）"
    case_refs: ["case-2026-003"]

  - id: "2.3.1-no-placeholder-bundle-id"
    type: shell
    command: "grep -rhn 'PRODUCT_BUNDLE_IDENTIFIER\\|bundleIdentifier' --include='*.pbxproj' --include='project.yml' --include='*.xcconfig' . 2>/dev/null | grep -iE 'demo|test|sample|example|placeholder' | head -5"
    expected: empty
    severity: high
    on_fail: "Bundle ID 含 demo/test/sample 字样 — 违反 2.3.1 元数据准确性（App Review 会判为未完成 App）"
    case_refs: []

  - id: "2.3.1-privacy-tracking-consistency"
    type: shell
    command: "MF=$(find . -name 'PrivacyInfo.xcprivacy' -not -path '*/Pods/*' 2>/dev/null | head -1); if [ -n \"$MF\" ]; then HAS_TRACKING_SDK=$(grep -rEn 'import Adjust|import AppsFlyerLib|import Branch|import Kochava|import Singular' --include='*.swift' --include='*.m' . 2>/dev/null | head -1); TRACKING_DECL=$(grep -A1 '<key>NSPrivacyTracking</key>' \"$MF\" 2>/dev/null | grep -oE '<true/>|<false/>' | head -1); if [ -n \"$HAS_TRACKING_SDK\" ] && [ \"$TRACKING_DECL\" = '<false/>' ]; then echo \"INCONSISTENT: tracking SDK present but NSPrivacyTracking=false\"; fi; fi"
    expected: empty
    severity: high
    on_fail: "PrivacyInfo.xcprivacy 声明 NSPrivacyTracking=false 但代码中集成了 tracking SDK (Adjust/AppsFlyer/Branch/Kochava/Singular) — 声明不一致。ATT 未授权时这些 SDK 的网络请求会失败，Apple 审核也会质疑"
    case_refs: []

  - id: "2.3.1-no-hardcoded-api-keys"
    type: shell
    command: "grep -rEn '(sk-[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|xoxb-[A-Za-z0-9-]{20,})' --include='*.swift' --include='*.plist' --include='*.m' --include='*.mm' --include='*.json' . 2>/dev/null | head -5"
    expected: empty
    severity: high
    on_fail: "源码中疑似硬编码 API Key（OpenAI sk-*/Google AIza*/Slack xoxb-*）"
    case_refs: []

review_notes_template: |
  - PrivacyInfo.xcprivacy is included and declares all Required Reason API categories
    used by the app (UserDefaults/DiskSpace/FileTimestamp/SystemBootTime as applicable).
  - All bundled third-party SDKs on Apple's privacy-impacting SDK list include their
    own PrivacyInfo.xcprivacy file.
  - Bundle ID and display name are production values (no demo/test markers).
  - All third-party credentials are loaded from external configuration.

fix_suggestions:
  - "生成 PrivacyInfo.xcprivacy：Xcode → File → New File → App Privacy File，按实际使用的 API 填 NSPrivacyAccessedAPITypes"
  - "UserDefaults 几乎必用，至少声明 NSPrivacyAccessedAPICategoryUserDefaults + CA92.1"
  - "升级 Firebase/OneSignal/MBProgressHUD 等 SDK 到带 manifest 的版本，或用 app_privacy_manifest_fixer 自动补齐"
  - "API Key 外部化到 xcconfig + .gitignore"

case_refs: ["case-2026-001", "case-2026-002", "case-2026-003"]
updated_at: "2026-04-22"
