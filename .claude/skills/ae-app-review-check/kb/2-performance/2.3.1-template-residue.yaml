guideline: "2.3.1"
chapter: "2-Performance"
title: "Template Residue — 模板/竞品 App 字符串残留"
severity: high
rubric:
  dimension: D3
  score_on_pass: 3
  score_on_warn: 1
  score_on_fail: 0
  weight: 1
official_text: |
  (a) Don't include any hidden, dormant, or undocumented features in your app;
  your app's functionality should be clear to end users and App Review.

  (来源 RQ 打样调研，IJCBRW)
  打样 App 工厂常见问题：从其他在售/已下架 App 模板 fork 后，未替换字符串。
  典型案例：
    - BeadSnap (拼豆 App) 的 NSUserTrackingUsageDescription 残留 "FaceFlow"
      (化妆 App) 的文案；NSCameraUsageDescription 残留 "analyze your facial features"
    - Stylab (穿搭 App) 的 Tell Friends 分享 sheet 显示 "Tell friends about CoKnit"
      (编织 App)；Smart Tool placeholder 显示 "Chat about knitting"
    - ComicNani (漫画 App) 的 ATT fallback 文案残留 "knitting tips and recommendations"

  Apple 人工审核会逐字读 usage description / share sheet / placeholder，发现
  跨业务串台时判 2.3.1(a) "inaccurate metadata" 或与 5.1.1 "misleading purpose
  string" 综合拒。AI 自动审 (ASR) 当前对语义错配检测能力有限，但 BeadSnap 已
  在 App Store 上说明可能放过；人工二审或后续版本会被发现。
official_url: "https://developer.apple.com/app-store/review/guidelines/#2.3.1"

triggers:
  - "App 由模板 fork 而来"
  - "App 工厂批量产出多个 App 共享 SwiftUI 代码"
  - "PIXELCELL / Codeway 类工厂模式"

auto_checks:
  - id: "2.3.1-residue-known-template-keywords"
    type: shell
    command: "grep -rEn '(FaceFlow|CoKnit|knitting tips|knitting|makeup recommendations|beauty content|facial features|face analysis|TemplateKit|Generated by AppGyver|MyApp|YourAppName)' --include='*.swift' --include='*.plist' --include='*.strings' --include='*.json' . 2>/dev/null | grep -vE '/Pods/|/\\.build/|/DerivedData/|//\\s' | head -10"
    expected: empty
    severity: high
    on_fail: "源码/Info.plist/strings 残留模板或竞品 App 字符串 — 2.3.1(a) inaccurate metadata + 5.1.1(i) misleading purpose string"
    case_refs: ["case-2026-007", "case-2026-008", "case-2026-010"]

  - id: "2.3.1-residue-share-sheet-app-name"
    type: shell
    command: "EXP_NAME=$(grep -rEn 'CFBundleDisplayName|displayName' --include='*.plist' . 2>/dev/null | grep -oE '<string>[^<]+</string>' | head -1 | sed 's/<[^>]*>//g'); if [ -n \"$EXP_NAME\" ]; then grep -rEn 'UIActivityViewController|activityItems|tellFriends|Tell friends about' --include='*.swift' . 2>/dev/null | grep -vE \"$EXP_NAME\" | grep -iE 'about|share' | head -3; fi"
    expected: empty
    severity: medium
    on_fail: "Tell Friends/Share 文案中的 App 名与 CFBundleDisplayName 不符 — 疑似模板复制未替换"
    case_refs: ["case-2026-008"]

review_notes_template: |
  - All in-app strings (usage descriptions, share sheet titles, placeholders) match the app's actual product name and functionality.
  - No template/sister-app branding leaks identified.

fix_suggestions:
  - "全工程 grep 已知模板/竞品关键词，逐项替换为本 App 的业务文案"
  - "扩展 forbidden_keywords 列表：在 v0.66.0 + 之后每发现一个新 App 工厂的字符串残留，append 到 SCHEMA.md 和本检查的 grep pattern"
  - "上架前固定一个 'String Audit' checklist：UIActivityViewController title/subject、所有 NSXxxUsageDescription、所有 chat composer placeholder、所有 Onboarding/Paywall 标题"

case_refs: ["case-2026-007", "case-2026-008", "case-2026-010"]
updated_at: "2026-04-29"
