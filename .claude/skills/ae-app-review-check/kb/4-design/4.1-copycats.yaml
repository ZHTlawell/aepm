guideline: "4.1"
chapter: "4-Design"
title: "Copycats — 禁止抄袭/仿冒"
severity: high
official_text: |
  (a) Come up with your own ideas. We know you have them, so make yours come to
  life. Don't simply copy the latest popular app on the App Store, or make some
  minor changes to another app's name or UI and pass it off as your own.

  (b) [ASR & NR] Submitting apps which impersonate other apps or services is
  considered a violation of the Developer Code of Conduct and may result in
  removal from the Apple Developer Program.

  (c) You cannot use another developer's icon, brand, or product name in your
  app's icon or name, without approval from the developer.

  关联 4.3(a) Spam: "We noticed your app shares a similar binary, metadata,
  and/or concept as apps previously submitted by a terminated Apple Developer
  Program account."
official_url: "https://developer.apple.com/app-store/review/guidelines/#4.1"

triggers:
  - "App 名称/icon 疑似蹭热门 App"
  - "代码或 UI 大量来自付费模板 / 开源 starter kit"
  - "公司此前有被终止的开发者账号历史"
  - "社交 / 算命星座 / 同类 Bible App 等饱和赛道"

auto_checks:
  - id: "4.1-no-template-markers"
    type: shell
    command: "grep -rEn '(Generated by|Template|Boilerplate|starter kit|Created by Xcode|MyApp|YourApp|AppName)' --include='*.swift' . 2>/dev/null | grep -vE '//\\s*Copyright|//\\s*Created by .+ on 20' | head -5"
    expected: empty
    severity: medium
    on_fail: "源码残留模板/样板标记 — 可能被 4.3 Spam 判定"
    case_refs: ["case-2026-005"]

  - id: "4.1-no-brand-impersonation-in-name"
    type: shell
    command: "grep -rhEn 'CFBundleDisplayName\\|CFBundleName' --include='*.plist' -A1 . 2>/dev/null | grep -iE '>(YouVersion|Bible Gateway|Bible App|Holy Bible|Wechat|WhatsApp|Instagram|TikTok|ChatGPT)<' | head -3"
    expected: empty
    severity: high
    on_fail: "App 显示名称疑似蹭知名 App 品牌 — 4.1(c)"
    case_refs: []

  - id: "4.1-unique-view-count"
    type: shell
    command: "find . -name '*.swift' -not -path '*/Pods/*' -not -path '*/.build/*' 2>/dev/null | xargs grep -l 'struct.*:\\s*View' 2>/dev/null | wc -l"
    expected: non_empty
    severity: low
    on_fail: "几乎没有独立 View 文件 — 可能被 4.2 Minimum Functionality 判定"
    case_refs: []

  - id: "4.1-no-minor-variant-bundle-id"
    type: shell
    command: "grep -rhn 'PRODUCT_BUNDLE_IDENTIFIER\\|bundleIdentifier' --include='*.pbxproj' --include='project.yml' --include='*.xcconfig' . 2>/dev/null | grep -iE '(v2|v3|copy|clone|alt|2$|3$)' | head -3"
    expected: empty
    severity: medium
    on_fail: "Bundle ID 中含 v2/copy/clone 等字样 — 疑似马甲包，触发 4.3 Spam"
    case_refs: ["case-2026-005"]

review_notes_template: |
  - This app's UI, assets, and content were developed originally for our target audience.
  - [If using any commercial template] The template was customized substantially;
    list 3-5 unique features that differentiate this app from the template's default output.
  - No branded names (e.g. "YouVersion", "Bible Gateway", etc.) are used in our metadata.

fix_suggestions:
  - "如使用过付费 App 模板，尽量改 UI、改交互、改文案；保留 3-5 个独特功能点作为 Review Notes 说明"
  - "改 App name / description / 截图（整套替换，不是小改）"
  - "跨多个版本迭代改动（初次 4.3 被拒后 Apple 审核员会加严）"

case_refs: ["case-2026-005"]
updated_at: "2026-04-22"
