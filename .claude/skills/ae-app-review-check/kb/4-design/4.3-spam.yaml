guideline: "4.3"
chapter: "4-Design"
title: "Spam — 同质化/马甲包/饱和赛道"
severity: high
official_text: |
  (From Apple App Review Guidelines Section 4.3)
  Don't create multiple similar apps; if a single app has different versions
  for specific locations, sports teams, universities, etc., consider submitting
  a single app and provide the variations using in-app purchase.

  4.3(a) Apps that share a similar binary, metadata, and/or concept as apps
  previously submitted by a terminated Apple Developer Program account
  constitute spam.

  (实际拒审原文，见 case-2026-005)
  "We noticed your app shares a similar binary, metadata, and/or concept as
  apps previously submitted by a terminated Apple Developer Program account."
official_url: "https://developer.apple.com/app-store/review/guidelines/#4.3"

triggers:
  - "公司有多个类似 App（同类型不同皮肤）"
  - "用了付费商用 App 模板"
  - "开发者账号历史不干净"
  - "进入饱和赛道（社交、算命、星座、Bible 类）"

auto_checks:
  - id: "4.3-no-template-boilerplate-markers"
    type: shell
    command: "grep -rEn 'Generated by [^C]|Boilerplate|starter kit|TemplateKit|AppSkeleton|MyApp[A-Z]|YourApp[A-Z]' --include='*.swift' . 2>/dev/null | grep -vE '//\\s*Copyright' | head -5"
    expected: empty
    severity: medium
    on_fail: "源码残留模板标记 — 可能被 4.3(a) 判为 Spam"
    case_refs: ["case-2026-005"]

  - id: "4.3-no-duplicate-bundle-id-variants"
    type: shell
    command: "grep -rhn 'PRODUCT_BUNDLE_IDENTIFIER\\|bundleIdentifier' --include='*.pbxproj' --include='project.yml' --include='*.xcconfig' . 2>/dev/null | grep -iE '(v2$|v3$|copy$|clone$|[._-]2$|[._-]3$)' | head -3"
    expected: empty
    severity: medium
    on_fail: "Bundle ID 中含 v2/v3/copy/clone 等字样 — 疑似马甲包"
    case_refs: ["case-2026-005"]

review_notes_template: |
  - This app was developed originally for <target audience>. It shares no binary
    or metadata with any other app on the App Store.
  - [If using a paid template] We substantially customized the template; unique
    features include: <list 3-5>.

fix_suggestions:
  - "首次 4.3 被拒后，整体替换 App name / description / 截图（小改无效）"
  - "跨多个版本做综合改动，Apple 审核员会对 4.3 历史加严"
  - "避开饱和赛道或提供明显差异化"

case_refs: ["case-2026-005"]
updated_at: "2026-04-22"
