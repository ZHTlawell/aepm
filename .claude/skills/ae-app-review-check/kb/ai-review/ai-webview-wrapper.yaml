guideline: "ai-webview-wrapper"
chapter: "ai-review"
title: "AI 审核 — 纯 WebView 包装检测"
severity: high
official_text: |
  (基于 Guideline 4.2 Minimum Functionality 的 AI 延伸规则)

  Apps using WKWebView / SFSafariViewController as their primary UI, with few
  or no native views, are flagged by Apple AI review as "repackaged website"
  and rejected under 4.2.2.

  Apps shouldn't primarily be marketing materials, advertisements, web
  clippings, content aggregators, or a collection of links.
official_url: "https://developer.apple.com/app-store/review/guidelines/#4.2.2"

triggers:
  - "App 主要 UI 是 WKWebView"
  - "App 绝大部分页面来自远程 HTML"

auto_checks:
  - id: "ai-webview-dominance-ratio"
    type: shell
    command: "WV=$(grep -rEn 'WKWebView|SFSafariViewController|WebView\\(' --include='*.swift' . 2>/dev/null | wc -l); NV=$(grep -rEn 'struct\\s+\\w+\\s*:\\s*View\\b' --include='*.swift' . 2>/dev/null | wc -l); RATIO_FAIL=$(awk -v w=$WV -v n=$NV 'BEGIN { if (w > 3 && n <= w) print \"WEBVIEW_DOMINATES\"; else print \"OK\" }'); echo \"$RATIO_FAIL\""
    expected: no_match
    match_pattern: "WEBVIEW_DOMINATES"
    severity: high
    on_fail: "WebView 引用数量 >= 原生 View 数量 — 会被 Apple AI 审核判为 repackaged website (4.2.2)"
    case_refs: []

review_notes_template: |
  - The app uses WebView only for <specific feature, e.g. terms display or OAuth>.
    Primary functionality is implemented in native SwiftUI/UIKit views.

fix_suggestions:
  - "把核心功能改为 Native View（SwiftUI/UIKit）"
  - "WebView 只保留用于 OAuth、条款展示等辅助场景"
  - "至少 3-5 个独立 Native 主页面，功能不依赖远程 HTML"

case_refs: []
updated_at: "2026-04-22"
