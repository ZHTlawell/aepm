guideline: "ai-attribution"
chapter: "ai-review"
title: "AI 审核 — 归因 SDK 被误判为广告 App"
severity: medium
official_text: |
  (非 Apple 官方条文，来源于社区经验)

  Apple AI 自动审核（ASR, App Store Review 自动扫描）会对集成 Adjust / AppsFlyer /
  Branch / Kochava 等归因 SDK 的 App 加强审查，怀疑是否为广告平台或 ad-fraud app。
  此类 App 若 Review Notes 不主动说明 SDK 用途，被 Guideline 2.1 + 2.3.1 拒审的
  概率会上升。
official_url: "https://developer.apple.com/app-store/review/guidelines/#2.3.1"

triggers:
  - "App 集成了 Adjust / AppsFlyer / Branch / Kochava 等归因 SDK"

auto_checks:
  - id: "ai-attribution-sdk-detected"
    type: shell
    command: "grep -rEn 'import Adjust|import AppsFlyerLib|import Branch|import Kochava|import Singular' --include='*.swift' --include='*.m' . 2>/dev/null | head -5"
    expected: empty
    severity: low
    on_fail: "检测到归因 SDK — 建议在 Review Notes 中主动说明 SDK 仅用于内部归因分析，非广告投放；降低 AI 审核误判风险"
    case_refs: []

review_notes_template: |
  - The app uses <Adjust/AppsFlyer/etc.> SDK for internal attribution analytics only
    (to measure install sources from our own marketing channels). The SDK does not
    serve advertisements and does not track users outside our app.

fix_suggestions:
  - "在 ASC Review Notes 中主动说明归因 SDK 用途"
  - "如使用 ATT，确保在用户授权后才调用 SDK 的 tracking 接口"

case_refs: []
updated_at: "2026-04-22"
