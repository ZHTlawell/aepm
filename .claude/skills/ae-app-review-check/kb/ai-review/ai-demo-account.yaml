guideline: "ai-demo-account"
chapter: "ai-review"
title: "AI 审核 — 有登录功能必须提供 demo account"
severity: high
official_text: |
  (基于 Guideline 2.1 App Completeness 的延伸要求)

  "Submit your app for review only when it is complete and ready to be
  published. Make sure to thoroughly test your app on-device with the final
  release candidate build, fix any bugs before submitting, and include demo
  account info (and turn on your back-end service) in the 'App Review
  Information' section of App Store Connect."

  Apple 审核员无法访问需要注册才能体验的功能。如 App 有登录但 Review Notes 未提供
  demo account，AI 审核会自动判定"App not fully reviewable"并拒审。
official_url: "https://developer.apple.com/app-store/review/guidelines/#2.1"

triggers:
  - "App 有登录/注册功能"
  - "App 有需要后端账户才能使用的功能"

auto_checks:
  - id: "ai-demo-account-if-login"
    type: shell
    command: "grep -rEn 'import FirebaseAuth|Auth\\.auth\\(\\)|signIn|SignInView|LoginView|LoginViewController' --include='*.swift' . 2>/dev/null | head -3"
    expected: empty
    severity: low
    on_fail: "检测到登录相关代码 — 必须在 ASC Review Notes 提供 demo account（username + password）。缺失 demo account 是 AI 审核高频拒审原因"
    case_refs: []

review_notes_template: |
  - Demo Account:
      Username: <demo-account-email>
      Password: <demo-password>
  - This account is pre-populated with sample data covering all key features.

fix_suggestions:
  - "注册一个 demo account（不要是员工账号，建议专用测试账号）"
  - "填到 ASC → App Information → App Review Information → Sign-In Information"
  - "Demo account 数据要覆盖核心功能（付费用户状态、已有历史数据等）"

case_refs: []
updated_at: "2026-04-22"
